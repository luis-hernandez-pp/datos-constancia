<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO FACTURADOR</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        .loading {
            display: none;
        }
        .file-info {
            margin-top: 20px;
        }
        #canvas {
            display: none;
        }
    </style>
</head>
<body>

    <h2>Sube la constancia</h2>
    
    <!-- File input for PDF upload -->
    <input type="file" id="pdfFileInput" accept="application/pdf">
    
    <!-- Loading spinner -->
    <div class="loading">
        <img src="https://i.imgur.com/llF5iyg.gif" alt="Loading...">
    </div>
    
    <!-- Display selected PDF file name -->
    <div class="file-info">
        <p id="fileName">Ningún archivo seleccionado.</p>
    </div>
    
    <!-- Canvas for rendering PDF page -->
    <canvas id="canvas"></canvas>
    
    <div id="qrResult"></div>

    <div id="content"></div>

    <script>
        console.log('made with ❤︎⁠ by LK/SH');
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);

            // Extract the specific parameters
            const porder = urlParams.get('order');  // Gets '1234'
            const ptotal = urlParams.get('total');  // Gets '1234'

            console.log('Order:', porder);
            console.log('Total:', ptotal);

            // Handle file selection
            $('#pdfFileInput').change(function(event) {
                var file = event.target.files[0];
                if (file && file.type === 'application/pdf') {
                    $('#fileName').text('Processing PDF: ' + file.name);
                    $('.loading').show(); // Show loading spinner
                    processPDF(file);
                } else {
                    alert('Please upload a valid PDF file.');
                    $('#fileName').text('No file selected.');
                }
            });
            
            function processPDF(file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var typedarray = new Uint8Array(e.target.result);

                    // Use PDF.js to load the PDF
                    pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                        console.log("PDF loaded");
                        
                        // Get the first page (You can extend this for multiple pages)
                        pdf.getPage(1).then(function(page) {
                            var scale = 1.5;
                            var viewport = page.getViewport({ scale: scale });
                            
                            var canvas = document.getElementById('canvas');
                            var context = canvas.getContext('2d');
                            canvas.height = viewport.height;
                            canvas.width = viewport.width;

                            // Render the page onto the canvas
                            page.render({ canvasContext: context, viewport: viewport }).promise.then(function() {
                                // Now we have the PDF page rendered as an image in the canvas
                                extractQRCode(canvas);
                            });
                        });
                    });
                };
                reader.readAsArrayBuffer(file);
            }

            function modifyUrl(url, order, total) {
                const urlObj = new URL(url);

                // Remove the 'D3' parameter first if it exists (we will manually place it later)
                urlObj.searchParams.delete('D3');

                // Manually rebuild the URL, inserting D8 and D9 before D3
                const newUrl = urlObj.origin + urlObj.pathname + '?' + 
                    'D1=' + urlObj.searchParams.get('D1') + '&' +
                    'D2=' + urlObj.searchParams.get('D2') + '&' +
                    'D8=' + order + '&' +
                    'D9=' + total + '&' +
                    'D3=' + urlObj.searchParams.get('D3'); // Add D3 last
                
                return newUrl;
            }

            function extractQRCode(canvas) {
                var context = canvas.getContext('2d');
                var imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                var code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    if(porder){
                        fetch(code.data)
                            .then(response => response.text())
                            .then(data => {
                                document.getElementById('content').innerHTML = data;
                                autoInvoicing(porder,ptotal);
                            })
                            .catch(error => console.error('Error fetching content:', error));
                        //window.location.href=modifyUrl(code.data, porder, ptotal);//window.location.href=code.data+'&order='+porder+'&total='+ptotal;
                    }
                    else{
                        window.location.href=code.data;
                    }
                    $('#qrResult').html('<p>Datos Fiscales: <a href="' + code.data + '" target="_blank">' + code.data + '</a></p>');
                    $('.loading').hide(); // Hide loading spinner
                } else {
                    $('#qrResult').html('<p>Archivo sin QR.</p>');
                    $('.loading').hide(); // Hide loading spinner
                }
            }

            const preregimes=[
                "601 - General de Ley Personas Morales",
                "603 - Personas Morales con Fines no Lucrativos",
                "605 - Sueldos y Salarios e Ingresos Asimilados a Salarios",
                "606 - Arrendamiento",
                "607 - Régimen de Enajenación o Adquisición de Bienes",
                "608 - Demás ingresos",
                "610 - Residentes en el Extranjero sin Establecimiento Permanente en México",
                "611 - Ingresos por Dividendos (socios y accionistas)",
                "612 - Personas Físicas con Actividades Empresariales y Profesionales",
                "614 - Ingresos por intereses",
                "615 - Régimen de los Ingresos por Obtención de Premios",
                "616 - Sin obligaciones fiscales",
                "620 - Sociedades Cooperativas de Producción que optan por diferir sus ingresos",
                "621 - Incorporación Fiscal (derogado a partir de 2022, solo vigente para quienes aún aplican transición)",
                "622 - Actividades Agrícolas, Ganaderas, Silvícolas y Pesqueras",
                "623 - Opcional para Grupos de Sociedades",
                "624 - Coordinados",
                "625 - Régimen de las Actividades Empresariales con ingresos a través de Plataformas Tecnológicas",
                "626 - Régimen Simplificado de Confianza (RESICO)",
                "628 - Hidrocarburos",
                "629 - De los Regímenes Fiscales Preferentes y de las Empresas Multinacionales",
                "630 - Enajenación de acciones en bolsa de valores"
            ];
            function autoInvoicing(porderz,ptotalz){
                var rfc='';
                $('li').each(function(){
                    if($(this).text().includes('El RFC:')){
                        rfc=$(this).text().split(',')[0].replace('El RFC: ','');
                    }
                });
                var razonSocial=$('.ui-widget-content').eq(2).children('td').eq(1).text();
                var cyberpunk=$('.ui-widget-content').eq(24).children('td').eq(1).text();
                var regime=$('.ui-widget-content').eq(36).children('td').eq(1).text();
                if(!$('.ui-widget-content').eq(2).children('td').eq(0).text().includes('Denominación o')){
                    razonSocial=$('.ui-widget-content').eq(3).children('td').eq(1).text() + ' ' + $('.ui-widget-content').eq(4).children('td').eq(1).text() + ' ' + $('.ui-widget-content').eq(5).children('td').eq(1).text();
                    cyberpunk=$('.ui-widget-content').eq(26).children('td').eq(1).text();
                    regime=$('.ui-widget-content').eq(38).children('td').eq(1).text();
                }
                regime=regime.replace('Régimen de las','');
                regime=regime.replace('Régimen del','');
                regime=regime.replace('Régimen de el','');
                regime=regime.replace('Régimen del','');
                regime=regime.replace('Régimen de','');
                regime=regime.replace('Régimen ','');
                for (var i = 0; i < preregimes.length; i++) {
                    if (preregimes[i].toUpperCase().includes(regime.toUpperCase())) {
                        regime = preregimes[i].substring(0, 3);  // Extract first 3 characters
                        break;  // If you find the match, no need to continue the loop
                    }
                }
                const params = new URLSearchParams({
                    order: porderz,
                    total: ptotalz,
                    name: razonSocial,
                    rfc: rfc,
                    zip: cyberpunk,
                    email: "",
                    regime: regime,
                    cfdi: "G03",
                });

                console.log('rfc',rfc);
                console.log('razon social',razonSocial);
                console.log('cp',cyberpunk);
                console.log('regime',regime);
                const nurl=`https://parapaquetes.com/pages/facturacion/${params.toString().replace(/\./g, "_")}`;
                console.log(nurl);
                window.location.href=nurl;
            }
        });
    </script>

</body>
</html>
